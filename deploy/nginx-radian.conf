# Radian Agents: its own vhost for agents.radianmarketing.com; touches no other site.
# TLS is added to this block by certbot.
server {
    listen 80;
    listen [::]:80;
    server_name agents.radianmarketing.com;

    client_max_body_size 1m;

    # API + live progress (Server-Sent Events): no buffering, long timeouts.
    location /api/ {
        proxy_pass http://127.0.0.1:8210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
